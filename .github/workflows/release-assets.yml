#
# Attach the release assets to a GitHub release: the configured XT+ option ROM
# (ide_xtp-r638-ata1f0-8k.bin), its deterministic source archive
# (xtide-universal-bios-r638-src.tar) and SHA256SUMS, all built by
# release/assets.sh with the flake's pinned toolchain.
#
# It runs when a release is published for an r*-unemu.* tag whose tree has
# this workflow, and by hand (workflow_dispatch from main) for any existing
# tag. An optional expected SHA-256 of the source archive stops the upload on
# a mismatch.
name: Release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. r638-unemu.1 (the release must exist)"
        required: true
      source_sha256:
        description: "Expected SHA-256 of the source archive (optional)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      SOURCE_SHA256: ${{ inputs.source_sha256 }}
    steps:
      - name: Check the tag name
        run: |
          case "$TAG" in
            r*-unemu.*) ;;
            *) echo "not an unemu release tag: $TAG" >&2; exit 1 ;;
          esac
      - name: Check out the repository with its history and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Build the release assets
        run: nix develop --command release/assets.sh "$TAG" assets
      - name: Check the expected source archive SHA-256
        if: ${{ env.SOURCE_SHA256 != '' }}
        run: |
          actual="$(sha256sum assets/xtide-universal-bios-r638-src.tar | awk '{print $1}')"
          if [ "$actual" != "$SOURCE_SHA256" ]; then
            echo "source archive SHA-256 is $actual, expected $SOURCE_SHA256" >&2
            exit 1
          fi
      - name: Upload the assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            assets/ide_xtp-r638-ata1f0-8k.bin \
            assets/xtide-universal-bios-r638-src.tar \
            assets/SHA256SUMS
